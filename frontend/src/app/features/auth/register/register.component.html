<section class="auth-card">
  <h1>Criar conta</h1>
  <p class="subtitle">Cadastre-se para começar a organizar suas tarefas.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Nome (opcional)</span>
      <input type="text" formControlName="name" autocomplete="name" maxlength="120" />
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.errors) {
        <small class="field-error">
          @if (form.controls.email.errors['required']) {
            Informe seu email.
          } @else if (form.controls.email.errors['email']) {
            Email inválido.
          }
        </small>
      }
    </label>

    <label class="field">
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="new-password" required minlength="8" />
      @if (form.controls.password.touched && form.controls.password.errors) {
        <small class="field-error">
          @if (form.controls.password.errors['required']) {
            Informe uma senha.
          } @else if (form.controls.password.errors['minlength']) {
            A senha deve ter ao menos 8 caracteres.
          }
        </small>
      }
    </label>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Cadastrando...' : 'Cadastrar' }}
    </button>
  </form>

  <p class="redirect">
    Já tem conta? <a routerLink="/login">Entrar</a>
  </p>
</section>
