<section class="auth-card">
  <h1>Entrar</h1>
  <p class="subtitle">Acesse sua conta para gerenciar suas tarefas.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.errors) {
        <small class="field-error">
          @if (form.controls.email.errors['required']) {
            Informe seu email.
          } @else if (form.controls.email.errors['email']) {
            Email inválido.
          }
        </small>
      }
    </label>

    <label class="field">
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="current-password" required />
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <small class="field-error">Informe sua senha.</small>
      }
    </label>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="redirect">
    Ainda não tem conta? <a routerLink="/register">Cadastre-se</a>
  </p>
</section>
